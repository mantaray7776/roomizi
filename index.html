  * { box-sizing:border-box; }
  body { background-color:var(--paper); background-image:radial-gradient(ellipse 80% 45% at 50% 0%,color-mix(in srgb,var(--win) 11%,transparent),transparent),radial-gradient(circle at 50% 50%,transparent 25px,var(--grid) 25.5px 26.5px,transparent 27px),radial-gradient(circle at 50% 50%,transparent 25px,var(--grid) 25.5px 26.5px,transparent 27px); background-size:100% 100%,64px 64px,64px 64px; background-position:0 0,0 0,32px 32px; background-repeat:no-repeat,repeat,repeat; color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.6; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:0 44px; min-height:100vh; transition:background-color .25s ease,color .25s ease; -webkit-tap-highlight-color:transparent; }

  #fxCanvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50; }
  .wrap { max-width:980px; margin:0 auto; }
  #play { max-width:480px; margin:0 auto; width:100%; padding-top:28px; }
  #tour { max-width:720px; margin:0 auto; width:100%; padding-top:28px; }
  .stack { display:flex; flex-direction:column; gap:18px; }
  button,input,select { font-family:inherit; color:inherit; } a { color:inherit; }
  :focus-visible { outline:3px solid var(--o); outline-offset:2px; }

  h1,h2 { margin:0; font-family:var(--font-display); font-weight:700; line-height:1.55; text-wrap:balance; text-align:center; }
  h1 { font-size:clamp(46px,14vw,66px); } h2 { font-size:clamp(36px,11vw,48px); } h2.sec { font-size:clamp(24px,5vw,30px); text-align:right; }
  .sub { margin:0; color:var(--ink-soft); font-size:14px; text-align:center; }
  .pn { unicode-bidi:isolate; font-weight:700; } .pn.p0 { color:var(--x); } .pn.p1 { color:var(--o); }

  .topbar { position:fixed; top:max(12px,env(safe-area-inset-top,0px)); left:max(14px,env(safe-area-inset-left,0px)); z-index:20; display:flex; gap:8px; }
  .icon-btn { width:38px; height:38px; padding:0; display:grid; place-items:center; border-radius:50%; border:1.5px solid var(--rule); background:color-mix(in srgb,var(--surface) 88%,transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); cursor:pointer; transition:border-color .15s,transform .15s; }
  .icon-btn:hover { border-color:var(--ink); transform:translateY(-1px); }
  .icon-btn svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
  .card { display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-width:0; text-decoration:none; color:var(--ink); background:linear-gradient(180deg,color-mix(in srgb,var(--x) 7%,var(--surface)),var(--surface) 58%); border:1.5px solid var(--rule); border-top:3.5px solid var(--x); border-radius:8px; padding:14px; transition:border-color .18s,transform .18s,box-shadow .18s; }
  .card:hover { border-color:var(--x); transform:translateY(-3px); box-shadow:0 8px 20px -10px color-mix(in srgb,var(--x) 40%,transparent); }
  .card h3 { margin:0; font-family:var(--font-display); font-weight:700; font-size:25px; line-height:1.6; }
  .card p { margin:0; font-size:14px; color:var(--ink-soft); }
  .card .tag { align-self:stretch; margin-top:4px; padding-top:6px; border-top:1px dashed var(--rule); font-size:12.5px; color:var(--ink-soft); }
  .ic { width:60px; height:60px; fill:none; stroke:var(--line); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  .ic .rx { stroke:var(--x); } .ic .bo { stroke:var(--o); } .ic .fx { fill:var(--x); } .ic .fo { fill:var(--o); }
  .ic .wd { stroke:var(--wood); stroke-width:4; } .ic .hd { fill:var(--x); stroke:none; } .ic .fb { fill:var(--x); fill-opacity:.18; stroke:none; } .ic .dt2 { fill:var(--line); stroke:none; }

  .back { align-self:flex-start; display:inline-flex; align-items:center; gap:4px; font-size:14px; font-weight:500; text-decoration:none; color:var(--ink-soft); padding:4px 2px; }
  .back:hover { color:var(--ink); } .back svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }

  .controls { display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .label { font-size:13px; color:var(--ink-soft); font-weight:500; }
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; padding:4px; background:var(--surface); border:1.5px solid var(--rule); border-radius:10px; }
  .seg button { min-width:0; border:0; background:transparent; padding:8px 6px; border-radius:7px; font-size:14px; font-weight:500; cursor:pointer; transition:background-color .15s,color .15s; }
  .seg button:hover { background:var(--grid); } .seg button[aria-checked="true"] { background:var(--ink); color:var(--paper); font-weight:700; }
  #botOpts { display:flex; flex-direction:column; gap:8px; }
  .pair { display:grid; grid-template-columns:3fr 2fr; gap:12px; }
  .hint { margin:0; font-size:13px; color:var(--ink-soft); min-height:1.6em; }

  .netbox { background:var(--surface); border:1.5px solid var(--rule); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .net-head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .net-tabs { display:inline-flex; gap:4px; padding:3px; background:var(--paper); border:1px solid var(--rule); border-radius:8px; }
  .net-tabs button { border:0; background:transparent; padding:5px 11px; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; }
  .net-tabs button[aria-pressed="true"] { background:var(--ink); color:var(--paper); font-weight:700; }
  .net-pill { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); font-weight:500; }
  .net-pill i { width:8px; height:8px; border-radius:50%; background:var(--win); opacity:.4; }
  .net-pill.wait i { background:var(--x); opacity:1; animation:pulseDot 1.2s ease-in-out infinite; }
  .net-pill.ok i { background:var(--good); opacity:1; } .net-pill.err i { background:var(--x); opacity:1; }
  @keyframes pulseDot { 50% { opacity:.25; transform:scale(.8); } }
  .net-host { display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center; }
  .qr-card { background:#fff; color:#111; padding:8px; border-radius:10px; border:1px solid var(--rule); width:136px; height:136px; display:grid; place-items:center; flex-shrink:0; }
  .qr-card svg { width:100%; height:100%; display:block; }
  .net-info { flex:1 1 180px; min-width:0; display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .room-code { font-family:var(--font-num); font-size:26px; font-weight:700; letter-spacing:3px; direction:ltr; unicode-bidi:isolate; color:var(--ink); line-height:1.2; }
  .net-btns { display:flex; flex-wrap:wrap; gap:6px; }
  .net-join { display:flex; gap:8px; align-items:center; }
  .net-input { flex:1 1 auto; min-width:0; padding:8px 12px; border-radius:8px; border:1.5px solid var(--rule); background:var(--paper); font-size:16px; font-weight:700; letter-spacing:3px; text-align:center; direction:ltr; }
  .net-setup { display:flex; flex-direction:column; gap:8px; padding:10px; border-radius:8px; background:var(--paper); border:1px dashed var(--rule); }
  .net-url-row { display:flex; gap:6px; align-items:center; }
  .net-url-in { flex:1 1 auto; min-width:0; padding:7px 10px; border-radius:8px; border:1.5px solid var(--rule); background:var(--surface); font-size:13px; direction:ltr; text-align:left; }
  .net-cmd { font-family:ui-monospace,monospace; font-size:12px; direction:ltr; text-align:left; padding:6px 8px; border-radius:6px; background:var(--surface); border:1px solid var(--rule); overflow-x:auto; }
  .net-note { margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.55; }

  .tour-banner { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding:10px 14px; background:var(--surface); border:1.5px solid var(--win); border-radius:8px; font-size:14px; font-weight:700; }
  .tour-cta { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 16px; background:linear-gradient(135deg,color-mix(in srgb,var(--win) 12%,var(--surface)),var(--surface)); border:1.5px solid var(--win); border-radius:8px; text-decoration:none; transition:transform .15s; }
  .tour-cta:hover { transform:translateY(-2px); }
  .tour-cta b { font-family:var(--font-display); font-size:22px; line-height:1.5; display:block; } .tour-cta span { font-size:13px; color:var(--ink-soft); }
  .tour-players { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; }
  .tp-row { display:flex; align-items:center; gap:6px; padding:6px 8px; background:var(--paper); border:1px solid var(--rule); border-radius:8px; }
  .tp-num { font-size:12.5px; color:var(--ink-soft); width:18px; text-align:center; font-weight:700; }
  .tp-in { flex:1 1 auto; min-width:0; padding:5px 8px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); font-size:14px; }
  .tp-bot { border:1px solid var(--rule); background:var(--surface); padding:5px 9px; border-radius:6px; font-size:12.5px; font-weight:700; cursor:pointer; flex-shrink:0; }
  .tp-bot[aria-pressed="true"] { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .tour-sel { width:100%; padding:9px 12px; border-radius:8px; border:1.5px solid var(--rule); background:var(--surface); font-size:14px; font-weight:500; }
  .champ-box { text-align:center; padding:18px 16px; background:linear-gradient(180deg,color-mix(in srgb,var(--win) 18%,var(--surface)),var(--surface)); border:2px solid var(--win); border-radius:10px; display:flex; flex-direction:column; gap:4px; align-items:center; }
  .champ-box small { font-size:13px; color:var(--ink-soft); } .champ-box b { font-family:var(--font-display); font-size:clamp(30px,8vw,44px); line-height:1.4; color:var(--good); }

    if (a === 'resume') { if (DATA.save) { resumeNext = true; location.hash = '#' + DATA.save.id; } } else if (a === 'again') { if (DATA.save) location.hash = '#' + DATA.save.id; }
    else if (a === 'drop') { DATA.save = null; saveData(); renderMemory(); } else if (a === 'clear-ask') { clearArm = true; renderMemory(); } else if (a === 'clear-no') { clearArm = false; renderMemory(); } else if (a === 'clear-yes') wipe();
  });
  $('#skipAll').addEventListener('click', function () { $('#rest').scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth' }); });

  var TINT = ['var(--x)', 'var(--o)', 'var(--win)'], showEl, pinEl, slideEls = [], pagerBtns = [], rafId = 0;
  function renderHome() {
    var cards = '', slides = '', pager = '<button type="button" data-go="0" aria-label="شروع" aria-current="true"></button>';
    ORDER.forEach(function (id, i) {
      var g = GAMES[id];
      cards += '<a class="card" data-game="' + id + '" href="#' + id + '">' + g.icon + '<h3>' + g.titleHtml + '</h3><p>' + g.blurb + '</p><span class="tag">' + g.tag + '</span></a>';
      slides += '<article class="slide" data-game="' + id + '" style="--tint:' + TINT[i % TINT.length] + '"><div class="s-ic">' + g.icon + '</div><h3 class="big">' + g.titleHtml + '</h3><p class="s-bl">' + g.blurb + '</p><p class="s-chips"><span>' + g.tag + '</span><span>' + (g.botOnly ? 'با ربات یا آنلاین' : 'تک‌دستگاه، ربات و آنلاین') + '</span></p><a class="btn primary go" href="#' + id + '">بازی کن</a></article>';
      pager += '<button type="button" data-go="' + (i + 1) + '" aria-label="' + plain(g.titleHtml) + '" aria-current="false"></button>';
    });
    $('#cards').innerHTML = cards; $('#slides').innerHTML = slides; $('#pager').innerHTML = pager;
    $('#introSub').textContent = fa(ORDER.length) + ' بازی رومیزی؛ دونفره روی یک دستگاه، با ربات، تورنومنت یا آنلاین.';
    showEl = $('#show'); pinEl = $('#pin');
    slideEls = [showEl.querySelector('.slide.intro')].concat(Array.prototype.slice.call(showEl.querySelectorAll('#slides .slide')));
    pagerBtns = Array.prototype.slice.call($('#pager').querySelectorAll('button'));
    showEl.style.setProperty('--steps', String(ORDER.length));
    $('#pager').addEventListener('click', function (e) { var b = e.target.closest('button[data-go]'); if (!b) return; var r = showEl.getBoundingClientRect(), total = r.height - pinEl.offsetHeight; window.scrollTo({ top: r.top + window.scrollY + total * (Number(b.dataset.go) / (slideEls.length - 1)), behavior: reducedMotion() ? 'auto' : 'smooth' }); });
    var tick = function () { if (!rafId) rafId = requestAnimationFrame(function () { rafId = 0; updateShow(); }); };
    window.addEventListener('scroll', tick, { passive: true }); window.addEventListener('resize', tick); updateShow();
  }
  function reducedMotion() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  function updateShow() {
    if (!showEl || reducedMotion() || $('#home').hidden) return;
    var r = showEl.getBoundingClientRect(), total = r.height - pinEl.offsetHeight;
    var p = total > 0 ? Math.min(1, Math.max(0, -r.top / total)) : 0, pos = p * (slideEls.length - 1), act = Math.round(pos);
    slideEls.forEach(function (el, i) {
      var d = pos - i, a = Math.abs(d), op = a <= 0.12 ? 1 : Math.max(0, 1 - (a - 0.12) / 0.5);
      el.style.opacity = op.toFixed(3); el.style.transform = 'translateY(' + (-d * 84).toFixed(1) + 'px) scale(' + (1 - Math.min(a, 1) * 0.07).toFixed(3) + ')';
      el.style.pointerEvents = a < 0.45 ? 'auto' : 'none'; el.inert = a >= 0.45;
    });
    pagerBtns.forEach(function (b, i) { b.setAttribute('aria-current', i === act ? 'true' : 'false'); });
  }
  function showHome() {
    clearTimeout(timer); stopNet(true); G = null; TOUR.cur = null;
    if (SET.mode === 'net') SET.mode = userMode || 'pvp';
    document.documentElement.removeAttribute('data-game');
    $('#play').hidden = true; $('#tour').hidden = true; $('#home').hidden = false; renderMemory();
    requestAnimationFrame(function () { window.scrollTo(0, lastHomeY); updateShow(); });
  }
  function openTournament() {
    clearTimeout(timer); stopNet(true); G = null; TOUR.cur = null;
    if (!$('#home').hidden) lastHomeY = window.scrollY || window.pageYOffset || 0;
    document.documentElement.removeAttribute('data-game');
    $('#home').hidden = true; $('#play').hidden = true; $('#tour').hidden = false;
    renderTour(); window.scrollTo(0, 0);
  }
  function openGame(id, resume, joinCode) {
    clearTimeout(timer); stopNet(true); TOUR.cur = null;
    if (!$('#home').hidden) lastHomeY = window.scrollY || window.pageYOffset || 0;
    G = GAMES[id]; S.id = id; document.documentElement.setAttribute('data-game', id);
    if (userMode === null) userMode = SET.mode === 'net' ? 'pvp' : SET.mode;
    var cleanJoin = String(joinCode || '').replace(/\D/g, '');
    SET.mode = cleanJoin ? 'net' : (G.botOnly ? 'pvb' : userMode);
    $('#home').hidden = true; $('#tour').hidden = true; $('#play').hidden = false;
    $('#backLink').href = '#'; $('#backTxt').textContent = 'همه بازی‌ها'; $('#controls').hidden = false; $('#tourBanner').hidden = true;
    $('#gTitle').innerHTML = G.titleHtml; $('#gBlurb').textContent = G.blurb; $('#rule').textContent = G.rule;
    $('#scores').classList.toggle('nodraw', !!G.noDraw);
    var sv = (!cleanJoin && resume && DATA.save && DATA.save.id === id) ? DATA.save : null;
    if (sv) {
      if (!G.botOnly && (sv.mode === 'pvp' || sv.mode === 'pvb')) { userMode = sv.mode; SET.mode = sv.mode; }
      if (['easy', 'medium', 'hard'].indexOf(sv.level) > -1) SET.level = sv.level;
      if (sv.first === 'human' || sv.first === 'bot') SET.first = sv.first;
      if (sv.opts && typeof sv.opts === 'object') SET.opts[id] = sv.opts;
      persist();
    }
    buildControls();
    if (cleanJoin) { S.scores = [0, 0, 0]; prevScores = [0, 0, 0]; S.starter = 0; mountStage(); newRound(true); connectNet(cleanJoin, 1); }
    else if (!(sv && restore(sv))) { var sc = DATA.scores[id]; S.scores = Array.isArray(sc) && sc.length === 3 ? sc.slice() : [0, 0, 0]; prevScores = S.scores.slice(); S.starter = 0; mountStage(); newRound(true); }
    window.scrollTo(0, 0);
  }
  function route() {
    var raw = location.hash.replace('#', ''), q = raw.indexOf('?'), id = q > -1 ? raw.slice(0, q) : raw, joinCode = '';
    if (id === 'tournament') { openTournament(); return; }
    if (q > -1) { try { joinCode = new URLSearchParams(raw.slice(q + 1)).get('join') || ''; } catch (e) {} }
    if (GAMES[id]) { var rs = resumeNext; resumeNext = false; openGame(id, rs, joinCode); } else showHome();
  }
  loadData(); renderHome(); window.addEventListener('hashchange', route); route();
})();
</script>
